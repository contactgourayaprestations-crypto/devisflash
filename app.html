<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DevisFlash — Mon espace</title>
<meta name="description" content="Créez vos devis en 2 minutes.">
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#f59e0b;--text:#f1f5f9;--muted:#94a3b8;--green:#4ade80;--red:#f87171;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 90px}
.topbar{position:sticky;top:0;background:rgba(15,23,42,.97);backdrop-filter:blur(6px);z-index:20;border-bottom:1px solid #1e293b;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:1.15rem}.logo span{color:var(--accent)}
.btn{background:var(--accent);color:#1c1005;border:none;border-radius:10px;padding:12px 18px;font-weight:800;font-size:1rem;cursor:pointer;width:100%}
.btn.sec{background:#334155;color:var(--text)}.btn.danger{background:#7f1d1d;color:#fecaca}.btn.sm{width:auto;padding:8px 14px;font-size:.9rem}
.card{background:var(--card);border-radius:14px;padding:18px;margin:14px 0}
label{display:block;font-weight:600;margin:12px 0 5px;font-size:.92rem}
input,select,textarea{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:var(--text);font-size:1rem}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px}
.err{display:none;background:#450a0a;color:#fca5a5;border-radius:9px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#0b1220;border-top:1px solid #1e293b;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:none;color:var(--muted);padding:12px 4px;font-size:.78rem;cursor:pointer}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs button .ic{font-size:1.3rem;display:block}
.view{display:none}.view.on{display:block}
.devis-item{background:var(--card);border-radius:12px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.devis-item .num{font-weight:700}.devis-item .cli{color:var(--muted);font-size:.88rem}
.badge{font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st-brouillon{background:#334155;color:#cbd5e1}.st-envoye{background:#1e3a8a;color:#bfdbfe}
.st-accepte{background:#052e16;color:#86efac}.st-refuse{background:#450a0a;color:#fca5a5}.st-facture{background:#451a03;color:#fbbf24}
.money{font-weight:800;font-size:1.05rem}
.ligne{background:#0f172a;border-radius:10px;padding:12px;margin:10px 0;position:relative}
.ligne .del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--red);font-size:1.1rem;cursor:pointer}
.total-box{background:#0f172a;border-radius:10px;padding:14px;margin:14px 0}
.total-box .r{display:flex;justify-content:space-between;padding:3px 0}
.total-box .ttc{font-size:1.3rem;font-weight:800;color:var(--accent);border-top:1px solid #334155;margin-top:8px;padding-top:8px}
.authbox{max-width:400px;margin:8vh auto 0}
.authbox .tabs2{display:flex;gap:8px;margin:14px 0}.authbox .tabs2 button{flex:1;padding:10px;border-radius:9px;border:none;font-weight:700;cursor:pointer;background:var(--accent);color:#1c1005}
.authbox .tabs2 button.off{background:#334155;color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
select.statut{width:auto;padding:8px 10px;font-size:.9rem}
.hidden{display:none!important}
/* ===== Impression PDF ===== */
#print-area{display:none}
@media print{
  body{background:#fff;color:#111}
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{display:block;position:absolute;top:0;left:0;right:0;padding:24px}
  .no-print{display:none!important}
}
.doc{font-size:12px;line-height:1.55;color:#111}
.doc h1{font-size:22px;margin-bottom:4px;color:#000}
.doc .meta{color:#555;margin-bottom:14px}
.doc .cols{display:flex;justify-content:space-between;gap:20px;margin:14px 0}
.doc .box{border:1px solid #ddd;border-radius:8px;padding:10px 12px;flex:1}
.doc table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px}
.doc th{background:#f59e0b;color:#1c1005;text-align:left;padding:8px}
.doc td{padding:8px;border-bottom:1px solid #eee}
.doc .totals{margin-left:auto;width:240px}
.doc .totals .r{display:flex;justify-content:space-between;padding:3px 0}
.doc .totals .ttc{font-weight:800;font-size:15px;border-top:2px solid #f59e0b;padding-top:6px;margin-top:4px}
.doc .mentions{margin-top:18px;font-size:10px;color:#555;border-top:1px solid #ddd;padding-top:10px}
.doc .sig{margin-top:26px;display:flex;justify-content:space-between}
.doc .sig div{border:1px dashed #aaa;border-radius:6px;width:45%;height:90px;padding:6px;font-size:10px;color:#777}
</style>
</head>
<body class="no-print">

<div id="auth-view" class="wrap view">
  <div class="authbox">
    <div class="logo" style="text-align:center;font-size:1.6rem;margin-bottom:8px">⚡ Devis<span>Flash</span></div>
    <p class="hint" style="text-align:center">Vos devis pro en 2 minutes.</p>
    <div class="card">
      <div class="tabs2">
        <button id="tab-login" onclick="authTab('login')">Connexion</button>
        <button id="tab-signup" class="off" onclick="authTab('signup')">Inscription</button>
      </div>
      <div class="err" id="auth-err"></div>
      <label>Email</label><input type="email" id="a-email" autocomplete="email" placeholder="vous@entreprise.fr">
      <label>Mot de passe</label><input type="password" id="a-pass" autocomplete="current-password" placeholder="8 caractères minimum">
      <button class="btn" id="a-go" onclick="submitAuth()" style="margin-top:16px">Se connecter</button>
      <p class="hint" style="text-align:center;margin-top:10px">14 jours gratuits · sans carte bancaire</p>
    </div>
  </div>
</div>

<div id="app-view" class="view">
  <div class="topbar no-print">
    <div class="logo">⚡ Devis<span>Flash</span></div>
    <button class="btn sec sm" onclick="logout()">↩</button>
  </div>
  <div class="wrap">

    <!-- LISTE -->
    <div id="v-list" class="view">
      <div class="row" style="align-items:center;margin-top:14px">
        <h2 style="flex:1">Mes devis</h2>
        <button class="btn sm" onclick="newDevis()">+ Nouveau</button>
      </div>
      <div class="row" style="margin-top:10px">
        <select id="f-statut" onchange="renderList()">
          <option value="">Tous statuts</option>
          <option value="brouillon">Brouillons</option><option value="envoye">Envoyés</option>
          <option value="accepte">Acceptés</option><option value="refuse">Refusés</option>
          <option value="facture">Facturés</option>
        </select>
        <input id="f-search" placeholder="🔍 Rechercher…" oninput="renderList()">
      </div>
      <div id="devis-list"></div>
    </div>

    <!-- ÉDITEUR -->
    <div id="v-edit" class="view">
      <div class="row" style="align-items:center;margin-top:14px">
        <button class="btn sec sm" onclick="show('v-list')">← Retour</button>
        <h2 style="flex:1;text-align:center" id="edit-title">Nouveau devis</h2>
        <span style="width:80px"></span>
      </div>
      <div class="err" id="edit-err"></div>
      <div class="card">
        <h3>👤 Client</h3>
        <label>Nom / Raison sociale *</label><input id="c-nom" placeholder="Ex : M. Dupont">
        <label>Adresse</label><input id="c-adresse" placeholder="12 rue des Lilas">
        <div class="row"><div><label>Code postal</label><input id="c-cp" placeholder="69003"></div>
        <div><label>Ville</label><input id="c-ville" placeholder="Lyon"></div></div>
        <div class="row"><div><label>Téléphone</label><input id="c-tel" type="tel" placeholder="06 12 34 56 78"></div>
        <div><label>Email</label><input id="c-email" type="email" placeholder="client@mail.fr"></div></div>
      </div>
      <div class="card">
        <div class="row" style="align-items:center"><h3 style="flex:1">🧱 Travaux</h3>
        <button class="btn sec sm" onclick="addLigne()">+ Ligne</button></div>
        <div id="lignes"></div>
      </div>
      <div class="card">
        <h3>💶 Chiffrage</h3>
        <div class="row">
          <div><label>TVA</label><select id="d-tva" onchange="calcTotaux()">
            <option value="20">20 %</option><option value="10">10 %</option>
            <option value="5.5">5,5 %</option><option value="0">0 %</option></select></div>
          <div><label>Acompte %</label><input id="d-acompte" type="number" min="0" max="100" value="30" oninput="calcTotaux()"></div>
        </div>
        <div class="total-box">
          <div class="r"><span>Total HT</span><b id="t-ht">0,00 €</b></div>
          <div class="r"><span>TVA</span><b id="t-tva">0,00 €</b></div>
          <div class="r ttc"><span>Total TTC</span><b id="t-ttc">0,00 €</b></div>
          <div class="r"><span>Acompte (<span id="t-acp">30</span>%)</span><b id="t-acm">0,00 €</b></div>
        </div>
        <label>Notes / conditions particulières</label>
        <textarea id="d-notes" placeholder="Ex : Délai d'intervention sous 3 semaines…"></textarea>
        <label>Statut</label>
        <select id="d-statut">
          <option value="brouillon">📝 Brouillon</option><option value="envoye">📤 Envoyé</option>
          <option value="accepte">✅ Accepté</option><option value="refuse">❌ Refusé</option>
          <option value="facture">🧾 Facturé</option>
        </select>
      </div>
      <button class="btn" onclick="saveDevis()">💾 Enregistrer le devis</button>
      <div class="row" style="margin-top:10px">
        <button class="btn sec" onclick="previewDevis()">👁 Aperçu PDF</button>
        <button class="btn danger" id="btn-del" onclick="deleteDevis()" style="display:none">🗑 Supprimer</button>
      </div>
    </div>

    <!-- ENTREPRISE -->
    <div id="v-settings" class="view">
      <h2 style="margin-top:14px">🏢 Mon entreprise</h2>
      <p class="hint">Ces infos apparaissent sur tous vos devis PDF.</p>
      <div class="err" id="set-err"></div>
      <div class="card">
        <label>Nom de l'entreprise *</label><input id="s-nom" placeholder="Ex : Martin Plomberie">
        <label>Adresse</label><input id="s-adresse">
        <div class="row"><div><label>Code postal</label><input id="s-cp"></div>
        <div><label>Ville</label><input id="s-ville"></div></div>
        <div class="row"><div><label>Téléphone</label><input id="s-tel" type="tel"></div>
        <div><label>Email</label><input id="s-email" type="email"></div></div>
        <label>SIRET</label><input id="s-siret" placeholder="123 456 789 00012">
        <label>N° TVA intracommunautaire</label><input id="s-tvaintra" placeholder="FR12 123456789">
        <label>Assurance décennale</label><input id="s-decennale" placeholder="Ex : AXA, contrat n°…">
      </div>
      <button class="btn" onclick="saveSettings()">💾 Enregistrer</button>
      <p class="hint" id="set-ok" style="color:var(--green);display:none">✓ Enregistré</p>
    </div>

  </div>
  <nav class="tabs no-print">
    <button id="t-list" class="on" onclick="show('v-list')"><span class="ic">📋</span>Devis</button>
    <button id="t-new" onclick="newDevis()"><span class="ic">➕</span>Nouveau</button>
    <button id="t-set" onclick="show('v-settings');loadSettings()"><span class="ic">🏢</span>Entreprise</button>
  </nav>
</div>

<div id="print-area"></div>

<script>
/* ============ API ============ */
const API='/.netlify/functions', TK='df_token';
const getT=()=>localStorage.getItem(TK), setT=t=>t?localStorage.setItem(TK,t):localStorage.removeItem(TK);
async function api(p,o={}){
  const h={'Content-Type':'application/json',...(o.headers||{})};
  const t=getT(); if(t)h['Authorization']='Bearer '+t;
  const r=await fetch(API+p,{...o,headers:h});
  let d={}; try{d=await r.json()}catch(e){}
  return{status:r.status,data:d};
}
const eur=n=>(Number(n)||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={brouillon:['📝','Brouillon'],envoye:['📤','Envoyé'],accepte:['✅','Accepté'],refuse:['❌','Refusé'],facture:['🧾','Facturé']};

/* ============ AUTH ============ */
let authMode='login';
function authTab(m){authMode=m;
  document.getElementById('tab-login').className=m==='login'?'':'off';
  document.getElementById('tab-signup').className=m==='signup'?'':'off';
  document.getElementById('a-go').textContent=m==='login'?'Se connecter':"Créer mon compte";}
function aErr(m){const e=document.getElementById('auth-err');e.textContent=m;e.style.display='block'}
async function submitAuth(){
  const email=document.getElementById('a-email').value.trim(),pw=document.getElementById('a-pass').value;
  if(!email||!pw)return aErr('Email et mot de passe requis.');
  if(authMode==='signup'&&pw.length<8)return aErr('8 caractères minimum.');
  const b=document.getElementById('a-go');b.disabled=true;b.textContent='…';
  try{
    const{status,data}=await api(authMode==='signup'?'/auth-signup':'/auth-login',{method:'POST',body:JSON.stringify({email,password:pw})});
    if(status===200||status===201){setT(data.token);enterApp();}
    else aErr(data.error||'Erreur.');
  }catch(e){aErr('Réseau indisponible.')}
  b.disabled=false;authTab(authMode);
}
async function logout(){try{await api('/auth-logout',{method:'POST'})}catch(e){} setT(null);location.reload()}
async function boot(){
  if(!getT()){showView('auth-view');return}
  const{status}=await api('/auth-me');
  if(status===200)enterApp();else{setT(null);showView('auth-view')}
}
function showView(id){document.querySelectorAll('#auth-view,#app-view').forEach(v=>v.classList.remove('on'));document.getElementById(id).classList.add('on')}
function enterApp(){showView('app-view');show('v-list');loadSettings(true)}

/* ============ NAV ============ */
function show(id){
  ['v-list','v-edit','v-settings'].forEach(v=>document.getElementById(v).classList.remove('on'));
  document.getElementById(id).classList.add('on');
  ['t-list','t-new','t-set'].forEach(t=>document.getElementById(t).classList.remove('on'));
  const map={'v-list':'t-list','v-edit':'t-new','v-settings':'t-set'};
  if(map[id])document.getElementById(map[id]).classList.add('on');
  if(id==='v-list')loadList();
  window.scrollTo(0,0);
}

/* ============ LISTE ============ */
let DEVIS=[];
async function loadList(){
  const box=document.getElementById('devis-list');
  box.innerHTML='<p class="hint">Chargement…</p>';
  const{status,data}=await api('/devis-list');
  if(status!==200){box.innerHTML='<p class="err" style="display:block">Erreur de chargement.</p>';return}
  DEVIS=data.devis||[];renderList();
}
function renderList(){
  const box=document.getElementById('devis-list');
  const fs=document.getElementById('f-statut').value,q=document.getElementById('f-search').value.toLowerCase();
  const items=DEVIS.filter(d=>(!fs||d.statut===fs)&&(!q||(d.numero+' '+d.clientNom).toLowerCase().includes(q)));
  if(!items.length){box.innerHTML='<div class="empty">📭 Aucun devis.<br><br><button class="btn sm" onclick="newDevis()">+ Créer mon premier devis</button></div>';return}
  box.innerHTML=items.map(d=>{
    const[e,l]=ST[d.statut]||ST.brouillon;
    const dt=d.dateCreation?new Date(d.dateCreation).toLocaleDateString('fr-FR'):'';
    return `<div class="devis-item" onclick="openDevis('${d.id}')">
      <div><div class="num">${esc(d.numero)}</div><div class="cli">${esc(d.clientNom)} · ${dt}</div></div>
      <div style="text-align:right"><span class="badge st-${d.statut}">${e} ${l}</span><div class="money">${eur(d.totalTTC)}</div></div>
    </div>`}).join('');
}

/* ============ ÉDITEUR ============ */
let CUR=null;
function newDevis(){CUR={id:null,client:{},lignes:[],tvaTaux:20,acomptePct:30,notes:'',statut:'brouillon'};
  document.getElementById('edit-title').textContent='Nouveau devis';
  document.getElementById('btn-del').style.display='none';fillForm();show('v-edit')}
async function openDevis(id){
  const{status,data}=await api('/devis-get?id='+encodeURIComponent(id));
  if(status!==200)return alert('Devis introuvable.');
  CUR=data.devis;
  document.getElementById('edit-title').textContent=CUR.numero||'Devis';
  document.getElementById('btn-del').style.display='';fillForm();show('v-edit');
}
function fillForm(){
  const c=CUR.client||{};
  document.getElementById('c-nom').value=c.nom||'';document.getElementById('c-adresse').value=c.adresse||'';
  document.getElementById('c-cp').value=c.cp||'';document.getElementById('c-ville').value=c.ville||'';
  document.getElementById('c-tel').value=c.tel||'';document.getElementById('c-email').value=c.email||'';
  document.getElementById('d-tva').value=CUR.tvaTaux!=null?CUR.tvaTaux:20;
  document.getElementById('d-acompte').value=CUR.acomptePct!=null?CUR.acomptePct:30;
  document.getElementById('d-notes').value=CUR.notes||'';
  document.getElementById('d-statut').value=CUR.statut||'brouillon';
  const box=document.getElementById('lignes');box.innerHTML='';
  (CUR.lignes&&CUR.lignes.length?CUR.lignes:[{description:'',quantite:1,unite:'',prixHT:0}]).forEach(addLigne);
  calcTotaux();
}
function addLigne(l){
  l=l||{description:'',quantite:1,unite:'',prixHT:0};
  const box=document.getElementById('lignes');
  const div=document.createElement('div');div.className='ligne';
  div.innerHTML=`<button class="del" onclick="this.parentNode.remove();calcTotaux()">✕</button>
    <label>Description *</label><input class="l-desc" value="${esc(l.description)}" placeholder="Ex : Pose de carrelage 60x60">
    <div class="row"><div><label>Qté</label><input class="l-qte" type="number" min="0" step="0.5" value="${l.quantite}" oninput="calcTotaux()"></div>
    <div><label>Unité</label><input class="l-unite" value="${esc(l.unite)}" placeholder="m², h, u…"></div>
    <div><label>Prix HT €</label><input class="l-prix" type="number" min="0" step="0.01" value="${l.prixHT}" oninput="calcTotaux()"></div></div>`;
  box.appendChild(div);
}
function readLignes(){
  return[...document.querySelectorAll('#lignes .ligne')].map(d=>({
    description:d.querySelector('.l-desc').value.trim(),
    quantite:parseFloat(d.querySelector('.l-qte').value)||0,
    unite:d.querySelector('.l-unite').value.trim(),
    prixHT:parseFloat(d.querySelector('.l-prix').value)||0
  })).filter(l=>l.description);
}
function calcTotaux(){
  const lignes=readLignes();
  const ht=lignes.reduce((t,l)=>t+l.quantite*l.prixHT,0);
  const tva=parseFloat(document.getElementById('d-tva').value)||0;
  const mtva=ht*tva/100,ttc=ht+mtva;
  const ap=parseFloat(document.getElementById('d-acompte').value)||0;
  document.getElementById('t-ht').textContent=eur(ht);
  document.getElementById('t-tva').textContent=eur(mtva);
  document.getElementById('t-ttc').textContent=eur(ttc);
  document.getElementById('t-acp').textContent=ap;
  document.getElementById('t-acm').textContent=eur(ttc*ap/100);
}
function eErr(m){const e=document.getElementById('edit-err');if(!m){e.style.display='none';return}e.textContent=m;e.style.display='block';window.scrollTo(0,0)}
async function saveDevis(){
  eErr(null);
  const devis={id:CUR.id,
    client:{nom:document.getElementById('c-nom').value.trim(),adresse:document.getElementById('c-adresse').value.trim(),
      cp:document.getElementById('c-cp').value.trim(),ville:document.getElementById('c-ville').value.trim(),
      tel:document.getElementById('c-tel').value.trim(),email:document.getElementById('c-email').value.trim()},
    lignes:readLignes(),tvaTaux:parseFloat(document.getElementById('d-tva').value)||20,
    acomptePct:parseFloat(document.getElementById('d-acompte').value)||0,
    notes:document.getElementById('d-notes').value.trim(),statut:document.getElementById('d-statut').value};
  if(!devis.client.nom)return eErr('Nom du client requis.');
  if(!devis.lignes.length)return eErr('Ajoutez au moins une ligne de travaux.');
  const{status,data}=await api('/devis-save',{method:'POST',body:JSON.stringify({devis})});
  if(status===200||status===201){CUR.id=data.id;CUR.numero=data.numero;
    document.getElementById('edit-title').textContent=data.numero;
    document.getElementById('btn-del').style.display='';
    alert('✓ Devis '+data.numero+' enregistré');show('v-list');
  }else eErr(data.error||'Erreur d\u2019enregistrement.');
}
async function deleteDevis(){
  if(!CUR.id||!confirm('Supprimer ce devis ?'))return;
  const{status}=await api('/devis-delete',{method:'POST',body:JSON.stringify({id:CUR.id})});
  if(status===200)show('v-list');else alert('Suppression impossible.');
}

/* ============ ENTREPRISE ============ */
let SET={};
async function loadSettings(silent){
  const{status,data}=await api('/settings');
  if(status===200){SET=data.settings||{};
    ['nom','adresse','cp','ville','tel','email','siret','tvaintra','decennale'].forEach(k=>{
      document.getElementById('s-'+k).value=SET[k]||''})}
  else if(!silent)document.getElementById('set-err').textContent='Chargement impossible.';
}
async function saveSettings(){
  const b={};['nom','adresse','cp','ville','tel','email','siret','tvaintra','decennale'].forEach(k=>b[k]=document.getElementById('s-'+k).value.trim());
  if(!b.nom){document.getElementById('set-err').textContent='Nom de l\u2019entreprise requis.';document.getElementById('set-err').style.display='block';return}
  document.getElementById('set-err').style.display='none';
  const{status,data}=await api('/settings',{method:'POST',body:JSON.stringify(b)});
  if(status===200){SET=data.settings;const o=document.getElementById('set-ok');o.style.display='block';setTimeout(()=>o.style.display='none',2500)}
}

/* ============ PDF (impression) ============ */
function devisDoc(d,s){
  const dt=d.dateCreation?new Date(d.dateCreation).toLocaleDateString('fr-FR'):'';
  const dv=d.dateValidite?new Date(d.dateValidite).toLocaleDateString('fr-FR'):'';
  const rows=d.lignes.map(l=>`<tr><td>${esc(l.description)}${l.unite?' ('+esc(l.unite)+')':''}</td><td align="right">${l.quantite}</td><td align="right">${eur(l.prixHT)}</td><td align="right"><b>${eur(l.quantite*l.prixHT)}</b></td></tr>`).join('');
  return `<div class="doc">
    <h1>DEVIS ${esc(d.numero||'')}</h1>
    <div class="meta">Émis le ${dt} · Valable jusqu'au ${dv}</div>
    <div class="cols">
      <div class="box"><b>${esc(s.nom||'')}</b><br>${esc(s.adresse||'')}<br>${esc(s.cp||'')} ${esc(s.ville||'')}<br>${esc(s.tel||'')}<br>${esc(s.email||'')}${s.siret?'<br>SIRET : '+esc(s.siret):''}${s.tvaIntra?'<br>TVA : '+esc(s.tvaIntra):''}</div>
      <div class="box"><b>Client</b><br><b>${esc(d.client.nom)}</b><br>${esc(d.client.adresse)}<br>${esc(d.client.cp)} ${esc(d.client.ville)}<br>${esc(d.client.tel)}<br>${esc(d.client.email)}</div>
    </div>
    <table><tr><th>Description</th><th width="60">Qté</th><th width="100" align="right">Prix HT</th><th width="110" align="right">Montant HT</th></tr>${rows}</table>
    <div class="totals">
      <div class="r"><span>Total HT</span><b>${eur(d.totalHT)}</b></div>
      <div class="r"><span>TVA ${d.tvaTaux} %</span><b>${eur(d.totalTVA)}</b></div>
      <div class="r ttc"><span>Total TTC</span><b>${eur(d.totalTTC)}</b></div>
      <div class="r"><span>Acompte ${d.acomptePct} %</span><b>${eur(d.acompteMontant)}</b></div>
      <div class="r"><span><b>Reste dû</b></span><b>${eur(d.totalTTC-d.acompteMontant)}</b></div>
    </div>
    ${d.notes?'<p><b>Notes :</b> '+esc(d.notes)+'</p>':''}
    <div class="mentions">
      Devis gratuit. Prix établis sur la base des taux de TVA en vigueur à la date du devis.<br>
      Acompte de ${d.acomptePct} % à la commande, soit ${eur(d.acompteMontant)}. Devis valable 3 mois.<br>
      ${s.decennale?'Garantie décennale : '+esc(s.decennale)+'. ':''}
      En cas de retard de paiement : pénalités au taux légal + indemnité forfaitaire de 40 € (art. L441-10 C. com).<br>
      Médiation de la consommation : tout litige peut être soumis à un médiateur. Assurance responsabilité civile professionnelle souscrite.
    </div>
    <div class="sig"><div>Signature de l'entreprise<br><br>Date :</div><div>Bon pour accord — signature du client<br><br>Date :</div></div>
  </div>`;
}
async function previewDevis(){
  // Sauvegarde d'abord si nouveau, puis imprime
  if(!CUR.id){await saveDevis();if(!CUR.id)return}
  const{status,data}=await api('/devis-get?id='+encodeURIComponent(CUR.id));
  if(status!==200)return alert('Chargement impossible.');
  await loadSettings(true);
  document.getElementById('print-area').innerHTML=devisDoc(data.devis,SET);
  window.print();
}
boot();
